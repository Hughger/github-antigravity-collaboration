name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run lifecycle regression tests
        run: python -m unittest discover -s skills/antigravity-codex-collaboration/scripts -p "test_*.py" -v
